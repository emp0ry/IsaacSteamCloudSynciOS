name: Build

on:
  push:
  pull_request:

jobs:
  ios-dylib:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Run core tests
        run: make test
      - name: Build with strict warnings
        run: make dylib EXTRA_CFLAGS='-Wall -Wextra -Werror'
      - name: Audit dynamic dependencies
        run: make audit EXTRA_CFLAGS='-Wall -Wextra -Werror'
